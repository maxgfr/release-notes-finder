name: GitHub Pages
on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]
permissions:
  contents: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn build
        env:
          CI: true
          PUBLIC_URL: /release-notes-finder
      - name: Publish the validated revision
        run: node scripts/deploy-pages.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
